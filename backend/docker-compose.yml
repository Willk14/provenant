# Local Postgres for Provenant. Dev credentials only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: provenant
      POSTGRES_PASSWORD: provenant_dev
      POSTGRES_DB: provenant
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
