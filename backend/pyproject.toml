[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenant"
version = "0.3.0"
description = "Contract-to-ledger platform: traceable extraction, deterministic accounting."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    # Pinned to a minor: the extractor relies on Page._get_textmap for char-level bboxes.
    "pdfplumber>=0.11,<0.12",
    "openpyxl>=3.1",
    "alembic>=1.13",
    "PyJWT[crypto]>=2.9",
    "anthropic>=2.9",
    "duckdb>=1.1",  # full-population journal entry analytics over Parquet
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.34"]  # PROVENANT_STORAGE=s3: AWS S3, Cloudflare R2, Supabase Storage, MinIO
dev = ["pytest>=8.3", "httpx>=0.27", "fpdf2>=2.7", "pgserver>=0.1.4"]

[tool.setuptools.packages.find]
include = ["provenant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
