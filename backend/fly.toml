# Provenant API on Fly.io (deploy with deploy/fly/deploy.ps1, which also sets the secrets).
# Database and sign-in: the Supabase project; files: a private Supabase Storage bucket over its S3 API.
# The extraction worker runs inside the API (PROVENANT_INLINE_WORKER=1), so one machine is always kept running.
# Secrets (never in this file): DATABASE_URL, MIGRATION_DATABASE_URL, PROVENANT_SUPABASE_URL,
# PROVENANT_SUPABASE_SECRET_KEY, PROVENANT_APP_URL, PROVENANT_S3_ENDPOINT, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# and optionally PROVENANT_SMTP_* and ANTHROPIC_API_KEY.
app = "provenant-ke-api"
primary_region = "lhr"  # London: closest Fly region to the Supabase database (eu-west-1, Ireland)

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Migrations as the table owner, before the new version starts.
  release_command = "python scripts/release.py"

[env]
  PROVENANT_DEV_AUTH = "0"
  PROVENANT_INLINE_WORKER = "1"
  PROVENANT_APP_ROLE = "provenant_app"
  PROVENANT_STORAGE = "s3"
  PROVENANT_S3_BUCKET = "provenant-files"
  PROVENANT_S3_PREFIX = "blobs"
  PROVENANT_S3_REGION = "eu-west-1"
  PROVENANT_EXTRACTOR = "labels"
  # Supabase's session pooler allows few connections on the free plan.
  PROVENANT_DB_POOL_SIZE = "3"
  PROVENANT_DB_MAX_OVERFLOW = "2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
