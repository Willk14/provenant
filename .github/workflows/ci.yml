name: ci

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - name: Tests (${{ matrix.database }})
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/postgres' || '' }}
        run: pytest -q
      - name: Baseline extractor on the golden set
        if: matrix.database == 'sqlite'
        run: python scripts/evaluate_extractor.py labels

  # The deployable stack: build both images, start Postgres, migrations, API, worker and web as they deploy,
  # and smoke-test it. Images are built, not pushed: publishing waits for a chosen host (docs/DEPLOYMENT.md).
  stack:
    runs-on: ubuntu-latest
    needs: [frontend, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: |
          docker compose up --detach --build
          # The migration runs once and exits, so wait on the API rather than on every container.
          for i in $(seq 1 60); do
            curl --fail --silent http://localhost:8000/health > /dev/null && exit 0
            sleep 5
          done
          echo "the API did not become healthy within 5 minutes"; exit 1
      - name: Smoke test the API (dev auth, as compose runs it)
        env:
          SMOKE_DEV_AUTH: "1"
        run: python3 backend/scripts/smoke.py http://localhost:8000
      - name: The web app serves and forwards /api
        run: |
          curl --fail --silent --show-error http://localhost:3100/ > /dev/null
          curl --fail --silent --show-error http://localhost:3100/api/health | grep -q '"ok"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose down --volumes
